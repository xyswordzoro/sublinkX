<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>SublinkX</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2"/>
<link rel="icon" href="/static/favicon.ico?v=2"/>
<link rel="stylesheet" href="/static/css/app.css?v=20261107z"/>
</head>
<body>

<!-- 弥散光斑 + 点状底纹 -->
<div class="mesh mesh-a" aria-hidden="true"></div>
<div class="mesh mesh-b" aria-hidden="true"></div>
<div class="mesh mesh-c" aria-hidden="true"></div>
<div class="dotgrid" aria-hidden="true"></div>

<!-- 登录页 -->
<div id="login-view" class="login-view" hidden>
  <div class="login-card">
    <div class="login-head">
      <span class="logo-mark"><i data-icon="zap"></i></span>
      <div class="login-title">
        <h1>SublinkX</h1>
        <p>节点订阅管理系统</p>
      </div>
    </div>
    <form id="login-form">
      <label class="field"><span>账号</span><input id="lg-user" class="input" autocomplete="username" required/></label>
      <label class="field" style="margin-top:14px"><span>密码</span><input id="lg-pass" class="input" type="password" autocomplete="current-password" required/></label>
      <p id="lg-error" class="form-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:14px">登 录</button>
    </form>
  </div>
</div>

<!-- 应用外壳 -->
<div id="app-view" class="app" hidden>
  <aside class="side">
    <div class="logo">
      <span class="logo-mark"><i data-icon="zap"></i></span>
      <span class="logo-name">SublinkX</span>
      
    </div>
    <div class="nav-label">核心控制</div>
    <nav class="nav" aria-label="主导航">
      <a class="nav-item" data-route="dashboard" href="#/dashboard"><i data-icon="dashboard"></i>仪表盘</a>
      <a class="nav-item" data-route="nodes" href="#/nodes"><i data-icon="server"></i>节点管理</a>
      <a class="nav-item" data-route="subs" href="#/subs"><i data-icon="link"></i>订阅管理</a>
      <a class="nav-item" data-route="templates" href="#/templates"><i data-icon="filecode"></i>模板配置</a>
    </nav>
    <div class="nav-label">系统运维</div>
    <nav class="nav" aria-label="系统">
      <a class="nav-item" data-route="logs" href="#/logs"><i data-icon="scrolltext"></i>操作日志</a>
      <a class="nav-item" data-route="settings" href="#/settings"><i data-icon="settings"></i>系统设置</a>
    </nav>
    <div class="side-status" id="side-status">
      <div class="side-status-row">
        <span><span class="pulse-dot"></span>系统服务正常</span>
        <a class="side-gh" href="https://github.com/xyswordzoro/sublinkX" target="_blank" rel="noopener"
           aria-label="打开项目主页" title="GitHub 项目主页">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
            <path d="M9 18c-4.51 2-5-2-7-2"/>
          </svg>
        </a>
      </div>
      <div class="side-status-bar"><span></span></div>
      <div class="side-status-row"><span>版本 <b>v<span id="side-ver">0.9</span></b></span><span id="side-clock" class="mono">--:--:--</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h2 class="page-title" id="page-title">仪表盘</h2>
      <div class="top-search">
        <i data-icon="search"></i>
        <input id="gs-input" placeholder="搜索节点、订阅…"/>
        <kbd>Enter</kbd>
      </div>
      <div class="top-actions">
        <button class="iconbtn" id="btn-refresh" type="button" aria-label="刷新数据"><i data-icon="refresh"></i></button>
        <button class="iconbtn" id="btn-theme" type="button" aria-label="切换主题模式"><i data-icon="moon"></i></button>
        <button class="iconbtn" id="btn-logout" type="button" aria-label="退出登录"><i data-icon="logout"></i></button>
        <div class="top-user">
          <span class="avatar" id="top-avatar">A</span>
          <span class="top-uname"><b id="top-uname-name">管理员</b><i>Super Admin</i></span>
        </div>
      </div>
    </header>
    <main id="view" class="bento" aria-live="polite"></main>
  </div>
</div>

<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<script src="/static/js/app.js?v=20261110b"></script>
</body>
</html>
